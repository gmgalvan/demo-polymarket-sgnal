[project]
name = "api-spacy-finance"
version = "0.1.0"
description = "FastAPI + spaCy API that answers basic finance questions, designed to run on CPU only (no GPU)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "spacy>=3.7,<3.9",
    "pymongo>=4.9,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
