# api-spacy-finance: FastAPI + spaCy, CPU-only. Stateless (all state
# lives in Mongo), so it's safe to run more than one replica.
#
# ${ECR_REGISTRY} / ${IMAGE_TAG} are placeholders - see README.md for
# how to render them with envsubst before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-spacy-finance
  namespace: session-5
  labels:
    app: api-spacy-finance
    app.kubernetes.io/name: api-spacy-finance
    app.kubernetes.io/instance: api-spacy-finance
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: session-5
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-spacy-finance
  template:
    metadata:
      labels:
        app: api-spacy-finance
        app.kubernetes.io/name: api-spacy-finance
        app.kubernetes.io/instance: api-spacy-finance
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: session-5
    spec:
      # CPU-only workload: no GPU/Inferentia needed, same node pool as
      # the LiteLLM gateway and MCP servers in the main demo.
      nodeSelector:
        workload: core
      containers:
        - name: api
          image: ${ECR_REGISTRY}/api-spacy-finance:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017
            - name: MONGO_DB_NAME
              value: finance_qa
          # readiness (/health) reflects real dependency status (Mongo)
          # and can knock this Pod out of the Service's endpoints if
          # Mongo is slow/down - that's the correct failure mode.
          # liveness (/livez) does zero I/O and must never fail just
          # because Mongo is having a bad day: killing an otherwise
          # healthy process over a downstream outage is exactly what
          # broke this the first time (see course.md, bug 2). Never
          # point livenessProbe at /health again.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
