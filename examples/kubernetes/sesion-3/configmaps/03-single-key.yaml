apiVersion: v1
kind: Pod
metadata:
  name: model-selection-demo
  namespace: sesion-3
  labels:
    app.kubernetes.io/name: model-selection-demo
    app.kubernetes.io/part-of: sesion-3
spec:
  containers:
    - name: inspector
      image: busybox:1.36
      env:
        - name: SELECTED_MODEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MODEL_NAME
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "AI model selected through configMapKeyRef: ${SELECTED_MODEL}"
          exec sleep 3600
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
  restartPolicy: Never
