apiVersion: v1
kind: ConfigMap
metadata:
  name: model-file-config
  namespace: sesion-3
  labels:
    app.kubernetes.io/part-of: sesion-3
data:
  vllm-config.yaml: |
    model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    served-model-name: tinyllama-1b
    host: "0.0.0.0"
    port: 8000
    dtype: half
    max-model-len: 1024
    gpu-memory-utilization: 0.50
    download-dir: /models
