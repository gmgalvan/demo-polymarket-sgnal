# Step 3 — dynamic provisioning, and what happens without a CSI driver.
#
# This PVC asks the default StorageClass (gp2) for a volume. Kubernetes itself
# does not know how to create an EBS volume: it delegates that to a CSI driver
# through the CreateVolume RPC. Until the EBS CSI driver is installed, the PVC
# stays Pending with this event:
#
#   Waiting for a volume to be created either by the external provisioner
#   'ebs.csi.aws.com' or manually by the system administrator.
#
# Install the driver (see the README) and the very same PVC binds without
# re-applying anything.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signal-history
  namespace: sesion-3
  labels:
    app.kubernetes.io/part-of: sesion-3
spec:
  # Access modes — how the volume may be mounted, and by how many NODES (not Pods):
  #
  #   ReadWriteOnce  (RWO)  one node reads and writes.   <- what EBS gives us
  #   ReadOnlyMany   (ROX)  many nodes read, none writes.
  #   ReadWriteMany  (RWX)  many nodes read and write.   <- what EFS gives us
  #
  # RWO is a physical property of a block device: a disk attaches to one machine.
  # It is also the reason step 8 moves to EFS.
  accessModes:
    - ReadWriteOnce
  # gp2 is the StorageClass EKS ships by default. Its legacy provisioner name is
  # translated to ebs.csi.aws.com by CSI migration.
  storageClassName: gp2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-writer
  namespace: sesion-3
  labels:
    app: signal-writer
    app.kubernetes.io/name: signal-writer
    app.kubernetes.io/part-of: sesion-3
spec:
  replicas: 1
  # Recreate: a ReadWriteOnce volume cannot be attached to two Pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: signal-writer
  template:
    metadata:
      labels:
        app: signal-writer
    spec:
      nodeSelector:
        workload: core
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "pod $(hostname) started at $(date -u)" >> /data/history.txt
              while true; do
                sleep 30
              done
          volumeMounts:
            - name: history
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: signal-history
