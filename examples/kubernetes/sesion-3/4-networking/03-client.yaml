apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: sesion-3
  labels:
    app: network-client
    lab: networking-demo
spec:
  nodeSelector:
    workload: core
  containers:
    - name: client
      image: busybox:1.37
      command: ["sh", "-c", "sleep 1d"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
