# Step 1 — emptyDir: a volume tied to the Pod lifecycle.
#
# The volume is created when the Pod is scheduled to a node and destroyed when
# the Pod is removed. Every container in the Pod can mount it, so it is the
# canonical way to share files between containers of the same Pod.
apiVersion: v1
kind: Pod
metadata:
  name: random-number-generator
  namespace: session-3
  labels:
    app.kubernetes.io/name: random-number-generator
    app.kubernetes.io/part-of: session-3
spec:
  nodeSelector:
    workload: core
  containers:
    # Writer: appends one random number every 5 seconds.
    #
    # It also watches for a sentinel file and exits when it appears. That is the
    # demo's way of restarting the container on demand: `kill 1` does not work
    # from inside a container, because the kernel discards signals sent to PID 1
    # unless the process installed a handler for them.
    - name: generator
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
      args:
        - |
          while true; do
            if [ -f /opt/restart-me ]; then
              rm -f /opt/restart-me
              echo "sentinel found, exiting so kubelet restarts this container"
              # Exit 0, not 1: with restartPolicy Always kubelet restarts the
              # container either way, and a clean exit keeps a red "Error" off
              # the screen during the demo.
              exit 0
            fi
            shuf -i 0-100 -n 1 >> /opt/number.out
            sleep 5
          done
      volumeMounts:
        - name: data-volume
          mountPath: /opt
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
    # Reader: proves the same volume is visible from another container.
    - name: reader
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
      args:
        - |
          while true; do
            echo "lines in /opt/number.out: $(wc -l < /opt/number.out 2>/dev/null || echo 0)"
            sleep 10
          done
      volumeMounts:
        - name: data-volume
          mountPath: /opt
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: data-volume
      emptyDir:
        sizeLimit: 64Mi
