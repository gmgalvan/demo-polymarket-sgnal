apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-chat-ui
  namespace: session-3
  labels:
    app: signal-chat-ui
    app.kubernetes.io/part-of: networking-demo
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location = /api/models {
        proxy_pass http://tinyllama-vllm.session-3.svc.cluster.local:8000/v1/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
      }

      location = /api/chat {
        proxy_pass http://tinyllama-vllm.session-3.svc.cluster.local:8000/v1/chat/completions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
      }

      location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Signal Chat · Kubernetes AI Demo</title>
        <style>
          :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07111f;
            color: #e8f0ff;
          }
          * { box-sizing: border-box; }
          body {
            min-height: 100vh;
            margin: 0;
            background:
              radial-gradient(circle at 12% 5%, rgba(33, 150, 243, .22), transparent 32rem),
              radial-gradient(circle at 88% 92%, rgba(0, 229, 196, .15), transparent 30rem),
              #07111f;
          }
          .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0; }
          header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 20px; }
          .brand { display: flex; align-items: center; gap: 13px; }
          .logo {
            width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
            background: linear-gradient(145deg, #1f8fff, #00d7b5); color: #04101d; font-size: 24px;
            box-shadow: 0 12px 34px rgba(0, 190, 255, .25);
          }
          h1 { margin: 0; font-size: clamp(1.15rem, 3vw, 1.55rem); letter-spacing: -.03em; }
          .subtitle { margin: 3px 0 0; color: #93a9c7; font-size: .86rem; }
          .status {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
            border: 1px solid #263a55; border-radius: 999px; color: #aebed4; background: rgba(10, 25, 43, .8);
            font-size: .78rem; white-space: nowrap;
          }
          .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffb74d; box-shadow: 0 0 12px currentColor; }
          .status.online .dot { background: #2ee6a6; }
          .status.offline .dot { background: #ff647c; }
          .panel {
            overflow: hidden; border: 1px solid #223753; border-radius: 22px;
            background: rgba(8, 20, 36, .88); box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
            backdrop-filter: blur(16px);
          }
          .meta {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #20334d;
            border-bottom: 1px solid #223753;
          }
          .meta div { background: #0b192b; padding: 14px 18px; }
          .meta span { display: block; color: #7890af; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; }
          .meta strong { display: block; margin-top: 5px; font-size: .87rem; font-weight: 600; overflow-wrap: anywhere; }
          #messages { min-height: 390px; max-height: 56vh; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
          .welcome { max-width: 610px; margin: 44px auto; text-align: center; color: #a6b7cf; }
          .welcome h2 { margin: 0 0 10px; color: #edf5ff; font-size: 1.45rem; }
          .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
          .chip {
            border: 1px solid #2b4667; border-radius: 999px; padding: 8px 11px; background: #0e2036;
            color: #b9cce5; cursor: pointer; font: inherit; font-size: .76rem;
          }
          .chip:hover { border-color: #2da4ff; color: #fff; }
          .message { display: flex; margin: 0 0 17px; }
          .message.user { justify-content: flex-end; }
          .bubble { max-width: min(78%, 690px); padding: 13px 15px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; }
          .assistant .bubble { background: #10243d; border: 1px solid #29425f; border-bottom-left-radius: 5px; }
          .user .bubble { background: linear-gradient(135deg, #1686df, #0870be); border-bottom-right-radius: 5px; }
          .composer { padding: 16px; border-top: 1px solid #223753; background: #091728; }
          form { display: flex; gap: 10px; }
          textarea {
            width: 100%; min-height: 50px; max-height: 140px; resize: none; border: 1px solid #2a405e;
            border-radius: 14px; padding: 13px 14px; color: #f2f7ff; background: #0c1d31; font: inherit; outline: none;
          }
          textarea:focus { border-color: #269bfa; box-shadow: 0 0 0 3px rgba(38, 155, 250, .12); }
          button[type="submit"] {
            min-width: 104px; border: 0; border-radius: 14px; padding: 0 18px; cursor: pointer;
            color: #03121e; background: linear-gradient(135deg, #27a5ff, #27e1b4); font-weight: 750;
          }
          button:disabled { cursor: wait; opacity: .55; }
          .hint { margin: 9px 3px 0; color: #657c9b; font-size: .7rem; text-align: center; }
          @media (max-width: 660px) {
            header { align-items: flex-start; flex-direction: column; }
            .meta { grid-template-columns: 1fr; }
            #messages { min-height: 350px; padding: 16px; }
            .bubble { max-width: 90%; }
            button[type="submit"] { min-width: 76px; }
          }
        </style>
      </head>
      <body>
        <main class="shell">
          <header>
            <div class="brand">
              <div class="logo">⌁</div>
              <div>
                <h1>Signal Chat</h1>
                <p class="subtitle">Polymarket demo · TinyLlama inference on EKS</p>
              </div>
            </div>
            <div id="status" class="status"><span class="dot"></span><span>Checking model</span></div>
          </header>

          <section class="panel">
            <div class="meta">
              <div><span>Model</span><strong id="modelName">tinyllama-1b</strong></div>
              <div><span>Serving</span><strong>vLLM · OpenAI API</strong></div>
              <div><span>Accelerator</span><strong>NVIDIA L40S</strong></div>
            </div>

            <div id="messages">
              <div id="welcome" class="welcome">
                <h2>Chat with the model running inside EKS</h2>
                <p>Ask a general question or explore a fictional prediction-market signal. The model has no live market data.</p>
                <div class="chips">
                  <button class="chip" data-prompt="Hello, who are you and what can you do?">Say hello</button>
                  <button class="chip" data-prompt="Explain prediction markets in two short sentences.">Prediction markets</button>
                  <button class="chip" data-prompt="Create a fictional GO or NO_GO signal for a BTC prediction market. Include confidence and clearly label it as a demo.">Demo signal</button>
                </div>
              </div>
            </div>

            <div class="composer">
              <form id="chatForm">
                <textarea id="prompt" rows="1" placeholder="Ask TinyLlama something…" required></textarea>
                <button id="send" type="submit">Send</button>
              </form>
              <p class="hint">Educational demo only · responses are generated by a small model and may be inaccurate.</p>
            </div>
          </section>
        </main>

        <script>
          const form = document.querySelector('#chatForm');
          const promptInput = document.querySelector('#prompt');
          const messagesElement = document.querySelector('#messages');
          const sendButton = document.querySelector('#send');
          const statusElement = document.querySelector('#status');
          const conversation = [
            { role: 'system', content: 'You are Signal Chat, a concise general-purpose assistant powered by TinyLlama. Reply in the same language as the user. Discuss Kubernetes only when asked. You may explain prediction markets, but you have no live data. Any market signal must be clearly labeled as fictional educational content, never financial advice.' }
          ];

          function addMessage(role, content) {
            document.querySelector('#welcome')?.remove();
            const row = document.createElement('div');
            row.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            row.appendChild(bubble);
            messagesElement.appendChild(row);
            messagesElement.scrollTop = messagesElement.scrollHeight;
            return bubble;
          }

          async function checkModel() {
            try {
              const response = await fetch('/api/models');
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const payload = await response.json();
              document.querySelector('#modelName').textContent = payload.data?.[0]?.id || 'tinyllama-1b';
              statusElement.className = 'status online';
              statusElement.lastElementChild.textContent = 'Model online';
            } catch (error) {
              statusElement.className = 'status offline';
              statusElement.lastElementChild.textContent = 'Model unavailable';
            }
          }

          async function sendMessage(text) {
            addMessage('user', text);
            conversation.push({ role: 'user', content: text });
            const pendingBubble = addMessage('assistant', 'Thinking…');
            sendButton.disabled = true;
            promptInput.disabled = true;

            try {
              const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'tinyllama-1b',
                  messages: conversation,
                  max_tokens: 120,
                  temperature: 0.2,
                  top_p: 0.9,
                  repetition_penalty: 1.1
                })
              });
              const payload = await response.json();
              if (!response.ok) throw new Error(payload.error?.message || `HTTP ${response.status}`);
              const answer = payload.choices?.[0]?.message?.content || 'The model returned an empty response.';
              pendingBubble.textContent = answer;
              conversation.push({ role: 'assistant', content: answer });
            } catch (error) {
              pendingBubble.textContent = `Request failed: ${error.message}`;
            } finally {
              sendButton.disabled = false;
              promptInput.disabled = false;
              promptInput.focus();
            }
          }

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = promptInput.value.trim();
            if (!text) return;
            promptInput.value = '';
            await sendMessage(text);
          });

          promptInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
              event.preventDefault();
              form.requestSubmit();
            }
          });

          document.querySelectorAll('[data-prompt]').forEach((button) => {
            button.addEventListener('click', () => sendMessage(button.dataset.prompt));
          });

          checkModel();
          window.setInterval(checkModel, 30000);
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-chat-ui
  namespace: session-3
  labels:
    app: signal-chat-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: networking-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signal-chat-ui
  template:
    metadata:
      labels:
        app: signal-chat-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: networking-demo
    spec:
      nodeSelector:
        workload: core
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: ui-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: ui-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: ui-config
          configMap:
            name: signal-chat-ui
---
apiVersion: v1
kind: Service
metadata:
  name: signal-chat-ui
  namespace: session-3
  labels:
    app: signal-chat-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: networking-demo
spec:
  type: ClusterIP
  selector:
    app: signal-chat-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-routing
  namespace: session-3
  labels:
    app.kubernetes.io/part-of: networking-demo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    external-dns.alpha.kubernetes.io/hostname: k8s.demo.example.com
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  ingressClassName: alb
  rules:
    - host: k8s.demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal-chat-ui
                port:
                  name: http
